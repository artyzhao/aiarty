name: Publish digest

on:
  schedule:
    - cron: "30 22 * * *"
    - cron: "30 7 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh stars and feeds
        run: |
          python3 fetch_stars.py
          python3 fetch_digest.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stars-data.js digest-data.js digest.html digest-i18n-cache.json
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          git commit -m "chore: daily digest $(TZ=Asia/Shanghai date +%F)"
          git push
