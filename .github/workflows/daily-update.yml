name: Daily data

on:
  schedule:
    - cron: "30 22 * * *"
    - cron: "30 7 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update stars
        run: python3 fetch_stars.py
      - name: Update daily digest
        run: |
          python3 fetch_digest.py
          # 公网首页是 index.html，需与 digest.html 同步，否则 ?v= 缓存戳停住，历史切片不更新
          cp digest.html index.html
      - name: Update A-share after close
        run: |
          hour=$(TZ=Asia/Shanghai date +%H)
          if [ "$hour" -ge 15 ]; then
            python3 fetch_data.py
          else
            echo "skip A-share fetch before 15:00 Asia/Shanghai"
          fi
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stars-data.js stars/today-1.svg stars/today-2.svg stars/today-3.svg \
            data.js data.json digest-data.js digest.html index.html digest-i18n-cache.json digest_history.py
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          git commit -m "chore: daily data $(TZ=Asia/Shanghai date +%F)"
          git push
